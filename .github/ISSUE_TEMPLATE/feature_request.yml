name: 功能建议
description: 希望 BindLink 支持新的 Mod、启动器或迁移方式
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前迁移时遇到了什么不便
      placeholder: 每次更新整合包都要手动重新设置 xxx 的按键
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 希望工具怎样处理，例如同步哪些文件、哪些设置需要保留
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 涉及的 Mod 或启动器
      description: 名称、版本，以及相关配置文件在游戏目录中的位置（如果知道）
      placeholder: Mod：xxx 1.2.3，配置文件 config/xxx.json

[package]
name = "mc-bindsync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
rfd = "0.17.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml_edit = "0.25.17"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
